[project]
name = "ssync"
version = "0.1.0"
description = "Space Sync UDP transport protocol prototype"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
]
dependencies = []

[project.optional-dependencies]
space = []
ground = [
    "rich>=14.3.3",
]

[project.scripts]
ssync = "ssync.space_sync.cli:main"
ssyncd = "ssync.space_sync.cli:ssyncd_main"

[dependency-groups]
lint = [
    "mypy>=1.18.2",
    "ruff>=0.13.0",
    "types-tqdm",
]
test = [
    "pytest>=8.0.0",
    "rich>=14.3.3",
    "tqdm>=4.67.3",
]
bench = [
    "pytest-benchmark>=5.0.0",
]
dev = [
    {include-group = "lint"},
    {include-group = "test"},
    {include-group = "bench"},
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ssync = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.13"
files = ["src", "tests", "scripts", "benchmarks"]
warn_return_any = true
warn_unused_configs = true
no_implicit_optional = true
