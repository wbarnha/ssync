name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Sync dependencies
        run: uv sync --dev

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy

      - name: Pytest
        run: uv run pytest -q

  test-freethreaded:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13t", "3.14t"]
    env:
      # actions/setup-python's free-threaded builds default to GIL enabled
      # (unlike python-build-standalone builds, e.g. via `uv python install`,
      # which default to disabled) - force it off so this job actually tests
      # free-threading.
      PYTHON_GIL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --only-group test

      - name: Verify GIL is disabled
        run: uv run python -c "import sys; assert not sys._is_gil_enabled()"

      - name: Pytest
        run: uv run pytest -q

  install-profiles:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        profile: [space, ground]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Build and install profile in isolation
        run: |
          make wheel
          uv venv .profile-venv
          wheels=(dist/*.whl)
          uv pip install --python .profile-venv/bin/python "${wheels[0]}[${{ matrix.profile }}]"

      - name: Verify dependencies and entry points
        env:
          SSYNC_PROFILE: ${{ matrix.profile }}
        run: |
          .profile-venv/bin/python - <<'PY'
          import importlib.util
          import os

          is_ground = os.environ["SSYNC_PROFILE"] == "ground"
          assert (importlib.util.find_spec("rich") is not None) == is_ground
          if is_ground:
              from ssync.space_sync.monitor import run_monitor_tui
          PY
          .profile-venv/bin/ssync --help
          .profile-venv/bin/ssyncd --help
