name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Sync dependencies
        run: uv sync --dev

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy

      # ubuntu-latest's default net.core.rmem_max (~208KB) is far below what
      # the receiver requests (ReceiverConfig.socket_rcvbuf_bytes, 8MiB
      # default), so the kernel silently caps it and open-loop (no-feedback)
      # e2e tests that burst data with no rate limit can overrun the actual
      # buffer and lose datagrams before the receiver drains it.
      - name: Raise UDP receive buffer limits
        run: sudo sysctl -w net.core.rmem_max=134217728 net.core.rmem_default=134217728

      - name: Pytest
        run: uv run pytest -q

  test-freethreaded:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13t", "3.14t"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --only-group test

      # actions/setup-python's free-threaded toolcache directory provides
      # both a "pythonX.Y" binary (GIL enabled by default, for backward
      # compatibility) and a "pythonX.Yt" binary (the real free-threaded
      # entry point, GIL disabled by default) - bare "python" resolves to
      # the former, so target the latter by its exact name (the matrix
      # value already is e.g. "3.13t"). Invoke the venv's own copy by path
      # (matching the install-profiles job's .profile-venv/bin/... pattern)
      # rather than through `uv run`: `uv run --no-sync "pythonX.Yt" ...`
      # resolves the name against the system toolcache instead of the venv,
      # missing the packages "Sync dependencies" just installed.
      - name: Verify GIL is disabled
        run: |
          .venv/bin/python${{ matrix.python-version }} -c "
          import sys
          print('executable:', sys.executable)
          print('version:', sys.version)
          assert not sys._is_gil_enabled()
          "

      # See the "test" job for why this is needed.
      - name: Raise UDP receive buffer limits
        run: sudo sysctl -w net.core.rmem_max=134217728 net.core.rmem_default=134217728

      - name: Pytest
        run: .venv/bin/python${{ matrix.python-version }} -m pytest -q

  install-profiles:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        profile: [space, ground]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Build and install profile in isolation
        run: |
          make wheel
          uv venv .profile-venv
          wheels=(dist/*.whl)
          uv pip install --python .profile-venv/bin/python "${wheels[0]}[${{ matrix.profile }}]"

      - name: Verify dependencies and entry points
        env:
          SSYNC_PROFILE: ${{ matrix.profile }}
        run: |
          .profile-venv/bin/python - <<'PY'
          import importlib.util
          import os

          is_ground = os.environ["SSYNC_PROFILE"] == "ground"
          assert (importlib.util.find_spec("rich") is not None) == is_ground
          if is_ground:
              from ssync.space_sync.monitor import run_monitor_tui
          PY
          .profile-venv/bin/ssync --help
          .profile-venv/bin/ssyncd --help
